name: Keepalive

# 为什么需要这个流水线：
# GitHub 规定「仓库连续 60 天没有活动，定时任务(schedule)会被自动停用」。
# 这个项目上一次失效就是这么来的——代码本身没坏，只是没人再往仓库推东西，
# 定时任务被悄悄关掉，然后就再也没跑过。
#
# 这里每月推一个空提交，把 60 天的计时器重置掉，定时任务就不会被停用。
# 不喜欢仓库里出现自动提交的话，直接删掉这个文件即可，但记得每隔一段时间
# 手动 push 一次，或者去 Actions 页面把定时任务重新启用。
on:
  schedule:
    # 每月 1 号 UTC 03:13
    - cron: '13 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 推一个空提交保持仓库活跃
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keepalive，防止定时任务因仓库不活跃被停用'
          git push
