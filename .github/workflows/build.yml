name: Build

# 只做编译和单元测试，不需要任何 Secrets，也不会碰你的 B 站账号。
# 有了这条流水线，改坏代码在合并之前就能发现，而不是等第二天定时任务失败才知道。
on:
  push:
    branches-ignore: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 编译并跑单元测试
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
