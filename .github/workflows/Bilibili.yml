name: Bilibili

# 触发方式：
#   schedule         - 每天定时执行一次（cron 用的是 UTC 时间）
#   workflow_dispatch - 在 Actions 页面手动点一次
#   push             - 往 main 推代码时顺带跑一次，方便验证配置改动
on:
  schedule:
    # UTC 01:27 == 北京时间 09:27，B 站每日任务 0 点重置，早上跑最稳妥
    - cron: '27 1 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'img/**'
      - 'LICENSE'

permissions:
  contents: read

# 同一时间只跑一个，避免手动触发和定时任务撞车导致重复投币
concurrency:
  group: bilibili-task
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 执行每日任务
        env:
          # 必填：B 站 Cookie
          BILI_JCT: ${{ secrets.BILI_JCT }}
          SESSDATA: ${{ secrets.SESSDATA }}
          DEDEUSERID: ${{ secrets.DEDEUSERID }}
          # 选填：推送渠道
          SENDKEY: ${{ secrets.SENDKEY }}
          SCKEY: ${{ secrets.SCKEY }}
          PUSHPLUSTK: ${{ secrets.PUSHPLUSTK }}
          DINGTALK: ${{ secrets.DINGTALK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 选填：排查问题时设成 DEBUG
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        run: |
          chmod +x gradlew
          ./gradlew runMain --no-daemon --console=plain
